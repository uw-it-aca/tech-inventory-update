[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-inventory-update"
dynamic = ["version"]
description = "SETS GitHub Inventory Updater"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "UWIT Student & Educational Technology Services", email = "aca-it@uw.edu"}
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dependencies = [
    "requests",
    "gspread",
    "pyyaml",
    "toml",
    "lxml",
    "beautifulsoup4",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.setuptools]
where = ["."]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = [
    "BLE001",  # allow broad Exception catches
]
